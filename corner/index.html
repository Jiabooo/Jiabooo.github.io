<style>
  /* --- 核心修改：透明度渐变过渡 --- */
  #footer {
    /* 1. 设置一个深色底色 (深海蓝)，但它是半透明的起点 */
    background: linear-gradient(180deg, rgba(0, 78, 146, 0) 0%, rgba(0, 78, 146, 1) 100%) !important;
    
    /* 2. 或者使用更自然的遮罩效果 (推荐) */
    /* 这会让页脚内容看起来像是“浮”出来的 */
    /* 如果你的网页背景是图片，用这个效果最好 */
    /* mask-image: linear-gradient(to bottom, transparent, black); */
    /* -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 100%); */

    /* 如果你的网页背景是纯色，用上面的 background 渐变就足够了 */
    /* 这里我保留你原本喜欢的深蓝色调，但让它从透明开始 */
    
    position: relative;
    z-index: 1;
    margin-top: 0;
    padding-bottom: 0;
    overflow: hidden;
    
    /* 增加一点内边距，让渐变区域更高，过渡更柔和 */
    padding-top: 40px; 
  }
  
  /* 强制文字颜色调整，配合深色背景 */
  #footer-wrap, #footer-wrap a {
    color: rgba(255, 255, 255, 0.9) !important;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3); /* 加一点阴影提高可读性 */
  }

  /* 波浪定位 */
  #footer-waves {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: -1;
  }
  
  .waves {
    position: relative;
    width: 100%;
    height: 10vh;
    min-height: 80px;
    max-height: 150px;
    margin-bottom: -7px;
  }
  
  /* 动画参数 */
  .parallax > use { animation: move-forever 25s cubic-bezier(.55, .5, .45, .5) infinite; }
  .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
  .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
  .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
  .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
  @keyframes move-forever {
    0% { transform: translate3d(-90px, 0, 0); }
    100% { transform: translate3d(85px, 0, 0); }
  }
  
  @media (max-width: 768px) {
    .waves { height: 50px; min-height: 50px; }
  }
</style>
<style>
  /* 1. 魔法阵容器 */
  div#hexo-blog-encrypt {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 60px auto; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: transparent !important;
    overflow: visible !important;
    z-index: 20; 
  }
  /* 隐藏原本的 label (如果有) */
  div#hexo-blog-encrypt > label { display: none; }

  /* 2. 局部星空层 */
  #universe-overlay {
    position: absolute; 
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    z-index: 10; 
    border-radius: 8px; 
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #universe-overlay::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 200px 200px;
    animation: twinkle 4s infinite;
    opacity: 0.3;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 0.5; }
    100% { opacity: 0.3; transform: translateY(-20px); }
  }

  /* 3. 画布容器 */
  #magic-canvas-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 500px; height: 500px;
    z-index: -1;
    pointer-events: none; 
  }

  /* 4. 输入框样式 (只针对 password 类型，防止误伤其他 input) */
  div#hexo-blog-encrypt input[type="password"] {
    background: rgba(0, 20, 40, 0.6) !important;
    border: 1px solid rgba(0, 196, 182, 0.4) !important;
    border-bottom: 2px solid #00c4b6 !important;
    color: #fff !important;
    text-align: center;
    font-family: monospace;
    font-size: 18px;
    width: 180px !important;
    margin-bottom: 20px !important;
    border-radius: 4px;
    text-shadow: 0 0 5px #00c4b6;
    backdrop-filter: blur(2px);
    transition: all 0.3s;
  }
  div#hexo-blog-encrypt input[type="password"]:focus {
     background: rgba(0, 20, 40, 0.9) !important;
     box-shadow: 0 0 15px rgba(0, 196, 182, 0.6);
  }

  /* 5. 按钮样式 (只针对原本的提交按钮，通常是在 input password 旁边的) */
  /* 注意：解锁后的 Encrypt again 按钮也是 .hbe-button，我们需要区分 */
  /* 但由于我们一旦检测到解锁就移除样式，所以问题不大 */
  div#hexo-blog-encrypt input[type="button"] {
    width: 50px !important;
    height: 50px !important;
    border-radius: 50% !important;
    background: radial-gradient(circle, #00c4b6 0%, #005f73 100%) !important;
    border: 2px solid #fff !important;
    color: transparent !important;
    cursor: pointer;
    box-shadow: 0 0 15px #00c4b6;
    transition: transform 0.3s;
  }
  div#hexo-blog-encrypt input[type="button"]:hover {
    transform: scale(1.15) rotate(90deg);
  }
  div#hexo-blog-encrypt input[type="button"]::after {
       font-family: "Font Awesome 6 Free";
       content: "\f084";
       font-weight: 900;
       color: #fff;
       position: absolute;
       left: 50%; top: 50%;
       transform: translate(-50%, -50%);
       font-size: 20px;
  }
</style>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

  // 核心清理函数
  function cleanUp(targetContainer, overlay) {
      // 1. 移除星空
      if (overlay) {
          overlay.style.opacity = '0';
          setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 500);
      }
      // 2. 还原容器样式
      if (targetContainer) {
          targetContainer.style.position = '';
          targetContainer.style.overflow = '';
          targetContainer.style.minHeight = '';
      }
      // 3. 移除魔法阵画布 (额外保险)
      const canvas = document.getElementById('magic-canvas-container');
      if (canvas) canvas.remove();
  }

  // 判断是否已解锁的函数
  function isUnlocked() {
      const encryptBox = document.getElementById('hexo-blog-encrypt');
      if (!encryptBox) return true; // 盒子都没了，肯定解锁了

      // 特征检测 1: 里面有没有 "Encrypt again" 按钮?
      // 您的 HTML 里那个按钮有 class "hbe-button"
      if (encryptBox.querySelector('.hbe-button')) return true;

      // 特征检测 2: 里面有没有解密后的特定内容?
      // 比如您的日历组件 class "fancy-calendar-wrapper"
      if (encryptBox.querySelector('.fancy-calendar-wrapper')) return true;
      
      // 特征检测 3: 里面有没有 input type="password"?
      // 如果没有密码框了，那多半也是解锁了
      if (!encryptBox.querySelector('input[type="password"]')) return true;

      return false; // 还在锁定状态
  }

  function initMagicScene() {
    const encryptBox = document.getElementById('hexo-blog-encrypt');
    
    // --- 第一关：初始状态检查 ---
    if (!encryptBox || isUnlocked()) {
        console.log('Page already unlocked or not encrypted. Skipping magic scene.');
        return; 
    }

    // --- 只有在“真·锁定”时才继续 ---

    // 1. 寻找父容器
    let targetContainer = encryptBox.parentNode;
    while (targetContainer && targetContainer.tagName !== 'BODY' && !targetContainer.classList.contains('post-content') && targetContainer.id !== 'article-container') {
       targetContainer = targetContainer.parentNode;
    }
    if (!targetContainer || targetContainer.tagName === 'BODY') {
       targetContainer = encryptBox.parentNode;
    }

    // 2. 插入星空
    let overlay = null;
    if (targetContainer) {
      targetContainer.style.position = 'relative';
      targetContainer.style.overflow = 'hidden'; 
      targetContainer.style.minHeight = '400px';

      if (!document.getElementById('universe-overlay')) {
        overlay = document.createElement('div');
        overlay.id = 'universe-overlay';
        targetContainer.insertBefore(overlay, targetContainer.firstChild);
      } else {
        overlay = document.getElementById('universe-overlay');
      }
    }

    // 3. Three.js 初始化
    if (document.getElementById('magic-canvas-container')) return;

    const canvasDiv = document.createElement('div');
    canvasDiv.id = 'magic-canvas-container';
    // 插入到密码框容器内，input 之前
    encryptBox.insertBefore(canvasDiv, encryptBox.firstChild);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(500, 500);
    renderer.setPixelRatio(window.devicePixelRatio);
    canvasDiv.appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();
    const magicTexture = textureLoader.load('/img/magic.png'); 

    const geometry = new THREE.PlaneGeometry(5, 5);
    const material = new THREE.MeshBasicMaterial({ 
      map: magicTexture,
      transparent: true,
      opacity: 1,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending 
    });

    const magicMesh = new THREE.Mesh(geometry, material);
    scene.add(magicMesh);

    const clock = new THREE.Clock();

    // 4. 渲染循环 (同时负责检测状态变化)
    function animate() {
      // 【核心检测】每次渲染都检查一次“是否解锁”
      if (isUnlocked()) {
          // 发现解锁了！
          cleanUp(targetContainer, overlay);
          return; // 停止循环
      }

      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      magicMesh.rotation.z = -elapsedTime * 0.2; 
      const breath = 0.7 + Math.sin(elapsedTime * 2) * 0.3; 
      magicMesh.material.opacity = breath;
      magicMesh.rotation.x = Math.sin(elapsedTime * 0.5) * 0.1;
      magicMesh.rotation.y = Math.cos(elapsedTime * 0.5) * 0.1;

      renderer.render(scene, camera);
    }
    animate();
  }

  if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMagicScene);
  } else {
      initMagicScene();
  }
  document.addEventListener('pjax:complete', initMagicScene);

</script>
